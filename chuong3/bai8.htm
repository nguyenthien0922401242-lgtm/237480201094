<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 3.8</title>
<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f5f5;
}

/* MENU CHÍNH */
.nav{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    background:linear-gradient(#1a237e, #3949ab);
}

.nav > li{
    position:relative;
}

.nav > li > a{
    display:block;
    padding:14px 22px;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.nav > li:hover{
    background:#ff9800;
}

/* SUB MENU */
.submenu{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    background:#3949ab;
    min-width:210px;
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
}

.submenu li{
    list-style:none;
}

.submenu a{
    display:block;
    padding:10px 15px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

.submenu a:hover{
    background:#ff9800;
    color:black;
}

/* SUB MENU CẤP 2 */
.submenu-right{
    left:100%;
    top:0;
    background:#5c6bc0;
}

/* HIỆN MENU */
.nav li:hover > .submenu{
    display:block;
}
</style>
</head>

<body>

<ul class="nav">
    <li><a href="#">Trang chủ</a></li>
    <li><a href="#">Giới thiệu</a></li>

    <li>
        <a href="#">Khóa học ▼</a>
        <ul class="submenu">
            <li><a href="#">Tin học căn bản</a></li>
            <li><a href="#">Tin học phổ thông</a></li>

            <li>
                <a href="#">Lập trình Pascal ▶</a>
                <ul class="submenu submenu-right">
                    <li><a href="#">Microsoft Word 2010</a></li>
                    <li><a href="#">Microsoft Excel 2010</a></li>
                    <li><a href="#">Microsoft PowerPoint 2010</a></li>
                </ul>
            </li>

            <li><a href="#">Lập trình C</a></li>
            <li><a href="#">Thiết kế website</a></li>
            <li><a href="#">Vẽ kỹ thuật AutoCAD</a></li>
        </ul>
    </li>

    <li><a href="#">Bài viết</a></li>
    <li><a href="#">Thủ thuật</a></li>
</ul>

</body>
</html>
